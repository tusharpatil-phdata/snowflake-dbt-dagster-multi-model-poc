version: 2

models:
  - name: mart_customer_360
    description: "Customer-level metrics"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

  - name: mart_product_performance
    description: "Product performance metrics"
    columns:
      - name: part_key
        tests:
          - unique
          - not_null

  - name: mart_sales_summary
    description: "Daily sales summary (1993) with incremental refresh"
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: total_revenue
        tests:
          - not_null